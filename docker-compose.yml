# Local Moodle instance for development (per-person, not shared).
# Postgres for the app itself is hosted separately via a cloud provider
# (see .env DATABASE_URL) — this compose file is Moodle + its own DB only.

services:
  moodle-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: moodlerootpass
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodleuser
      MARIADB_PASSWORD: moodlepass
    volumes:
      - moodle_db_data:/var/lib/mysql

  moodle:
    image: bitnamilegacy/moodle:latest
    restart: unless-stopped
    depends_on:
      - moodle-db
    ports:
      - "8080:8080"
    environment:
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodleuser
      MOODLE_DATABASE_PASSWORD: moodlepass
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: ChangeMe123!
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: "Agentic LMS Dev"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata

volumes:
  moodle_db_data:
  moodle_data:
  moodledata_data:
